<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark-mode">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PURPLE | ورود</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0418;
  --panel:#1a0a30;
  --violet:#a855f7;
  --violet2:#c084fc;
  --light:#d8b4fe;
  --text:#f3e8ff;
  --muted:#c4a5e8;
  --line:rgba(168,85,247,.3);
  --danger:#fb7185;
}
body{
  font-family:'Vazirmatn',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 0%, rgba(126,34,206,.35), transparent 60%),
    var(--bg);
  color:var(--text);
}
.card{
  width:100%;
  max-width:460px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px rgba(76,29,149,.4);
}
.header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}
.logo{
  width:52px;
  height:52px;
  flex:none;
  border-radius:16px;
  background:linear-gradient(135deg,#a855f7,#7e22ce);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 18px rgba(168,85,247,.4);
}
.logo svg{width:28px;height:28px}
.brand h1{
  font-size:22px;
  font-weight:800;
  color:#fff;
}
.brand p{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}
.lead{
  font-size:13.5px;
  color:var(--muted);
  line-height:1.8;
  margin-bottom:18px;
}
.status{
  display:flex;
  gap:16px;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:20px;
  flex-wrap:wrap;
}
.status b{color:var(--text);font-weight:600}
.dot{
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:#34d399;
  margin-left:6px;
  vertical-align:middle;
}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:8px;
  color:var(--text);
}
.slot{position:relative}
.slot .key{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:20px;height:20px;
  color:var(--violet);
  pointer-events:none;
}
input{
  width:100%;
  height:50px;
  padding:0 44px;
  font:600 15px 'Vazirmatn',sans-serif;
  color:var(--text);
  background:#0f041d;
  border:1px solid var(--line);
  border-radius:10px;
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:#7c5fa8;font-weight:400}
input:focus{
  outline:none;
  border-color:var(--violet2);
  box-shadow:0 0 0 3px rgba(168,85,247,.15);
}
.eye{
  position:absolute;
  left:6px;
  top:50%;
  transform:translateY(-50%);
  width:38px;height:38px;
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  border-radius:8px;
}
.eye:hover{color:var(--violet2)}
.eye svg{width:20px;height:20px}
.hint{
  min-height:18px;
  font-size:12px;
  color:#fbbf24;
  margin:6px 0;
}
.go{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  font:800 15px 'Vazirmatn',sans-serif;
  color:#fff;
  background:linear-gradient(135deg,#a855f7,#7e22ce);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:filter .2s,transform .1s;
}
.go:hover:not(:disabled){filter:brightness(1.12)}
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{opacity:.7;cursor:wait}
.go svg{width:18px;height:18px}
.err{
  display:none;
  margin-top:14px;
  padding:11px 14px;
  font-size:13px;
  color:#ffe4e9;
  background:rgba(251,113,133,.12);
  border-right:3px solid var(--danger);
  border-radius:8px;
}
.err.show{display:block}
.foot{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--muted);
  text-align:center;
}
.foot a{color:var(--violet2);text-decoration:none}
.foot a:hover{color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    </div>
    <div class="brand">
      <h1>PURPLE</h1>
      <p>Control Center</p>
    </div>
  </div>

  <p class="lead">مرکز فرمان آماده‌ست. کلید دسترسی رو وارد کن.</p>

  <div class="status">
    <span><i class="dot"></i>سرور آنلاین</span>
    <span>پینگ: <b id="ping">—</b></span>
  </div>

  <form id="loginForm" autocomplete="off">
    <label for="password">کلید دسترسی (رمز ادمین)</label>
    <div class="slot">
      <svg class="key" viewBox="0 0 24 24" fill="currentColor"><path d="M12.65 10A6 6 0 1 0 12.65 14H17v3h3v-3h2v-4zM7 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
      <input id="password" type="password" placeholder="رمز رو اینجا بنویس" required autofocus>
      <button class="eye" id="eye" type="button" aria-label="نمایش رمز">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="hint" id="caps"></div>
    <button class="go" id="loginBtn" type="submit">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <span id="goText">ورود به پنل</span>
    </button>
    <div class="err" id="errorMsg" role="alert"></div>
  </form>

  <div class="foot">
    PURPLE • Free For All • <a href="https://github.com/aghabanafshi6122/karbarg" target="_blank">GitHub</a>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var pw=$('password'), btn=$('loginBtn'), txt=$('goText'), err=$('errorMsg');

  /* ping */
  (function(){
    var t=performance.now();
    fetch('/cdn-cgi/trace',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw 0; $('ping').textContent=Math.round(performance.now()-t)+' ms';
    }).catch(function(){$('ping').textContent='—'});
  })();

  /* show/hide password */
  $('eye').addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    this.setAttribute('aria-label',show?'پنهان کردن رمز':'نمایش رمز');
  });

  /* caps lock */
  pw.addEventListener('keyup',function(e){
    $('caps').textContent=(e.getModifierState&&e.getModifierState('CapsLock'))?'Caps Lock روشنه':'';
  });

  function fail(m){
    err.textContent=m;
    err.classList.add('show');
    btn.disabled=false;
    txt.textContent='ورود به پنل';
  }

  /* login */
  $('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled=true;
    txt.textContent='در حال بررسی...';
    try{
      sessionStorage.removeItem('_auth_auto_redirect');
    }catch(_){}
    try{
      var r=await fetch('/login',{
        method:'POST',
        credentials:'same-origin',
        redirect:'manual',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'password='+encodeURIComponent(pw.value)
      });
      var ok=false;
      if(r.type==='opaqueredirect'){ok=true}
      else if(r.ok){
        var ct=r.headers.get('content-type')||'';
        if(ct.indexOf('application/json')>-1){
          var d=await r.json();
          if(d&&d.success===true)ok=true;
          else return fail((d&&(d.error||d.message))||'ورود ناموفق بود. رمز ادمین رو بررسی کن.');
        }else{
          pw.focus();pw.select();
          return fail('رمز اشتباهه. دوباره امتحان کن.');
        }
      }else return fail('ورود ناموفق بود (کد '+r.status+'). دوباره تلاش کن.');
      if(ok){
        txt.textContent='دسترسی تایید شد';
        setTimeout(function(){location.replace('/admin')},400);
      }
    }catch(_){
      fail('ارتباط با سرور برقرار نشد.');
    }
  });
})();
</script>
</body>
</html>
